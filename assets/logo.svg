<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M 64 12 C 86 24 104 28 108 30 C 108 64 96 98 64 116 C 32 98 20 64 20 30 C 24 28 42 24 64 12 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Protective Plate -->
  <path d="M 64 22 C 82 32 94 35 98 37 C 98 65 88 92 64 106 C 40 92 30 65 30 37 C 34 35 46 32 64 22 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.12" 
        stroke="url(#coreGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Dynamic Energy Node / Context Saver Symbol -->
  <!-- Central Pulse Ring -->
  <circle cx="64" cy="62" r="14" fill="none" stroke="url(#coreGrad)" stroke-width="3" stroke-dasharray="4 3" />
  
  <!-- Central Shield Core Dot -->
  <circle cx="64" cy="62" r="6" fill="url(#coreGrad)" />

  <!-- Synapse Rings (Context Boundary Links) -->
  <line x1="64" y1="36" x2="64" y2="48" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="76" x2="64" y2="88" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="42" y1="62" x2="50" y2="62" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="78" y1="62" x2="86" y2="62" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />

  <!-- Node Dots -->
  <circle cx="64" cy="34" r="3.5" fill="#38BDF8" />
  <circle cx="64" cy="90" r="3.5" fill="#38BDF8" />
  <circle cx="40" cy="62" r="3.5" fill="#818CF8" />
  <circle cx="88" cy="62" r="3.5" fill="#818CF8" />
</svg>
