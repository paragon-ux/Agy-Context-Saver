<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 584" width="860" height="584" style="max-width:100%;height:auto" role="img" aria-labelledby="tx-gov-title tx-gov-desc">
  <title id="tx-gov-title">Parent Transcript Access Precedence and Enforcement</title>
  <desc id="tx-gov-desc">Three-stage overview of how Agy-Context-Saver identifies top-level vs. child sessions, resolves five-tier transcript access precedence, and enforces authorized reads with short-lived single-use tokens.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --band-neutral: #f6f8fa;
      --band-neutral-border: #d0d7de;
      --band-tiers: #f2f7fd;
      --band-tiers-border: #80b3f2;
      --allow-bg: #eef8f0;
      --allow-border: #52a868;
      --deny-bg: #fdf2f2;
      --deny-border: #d9757c;
      --card-border: #d0d7de;
      --accent: #0969da;
      --green: #1a7f37;
      --red: #b4232c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --band-neutral: #161b22;
        --band-neutral-border: #30363d;
        --band-tiers: #121d2b;
        --band-tiers-border: #2f5d96;
        --allow-bg: #122117;
        --allow-border: #2d7a43;
        --deny-bg: #261417;
        --deny-border: #913d43;
        --card-border: #30363d;
        --accent: #58a6ff;
        --green: #3fb950;
        --red: #ff7b72;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .band-title { font-size: 13px; font-weight: 600; }
    .band-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .node-title { font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .node-sub { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
    .tier-title { font-size: 13px; font-weight: 600; }
    .tier-item { font-size: 11.5px; fill: var(--fg); }
    .tier-note { font-size: 11px; fill: var(--muted); }
    .edge-label { font-size: 12px; font-weight: 500; fill: var(--muted); text-anchor: middle; }
    .arrow-line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
    .arrow-head { fill: var(--line); }
  </style>

  <!-- Self-contained adaptive canvas background (seamless on GitHub/Zensical light and dark) -->
  <rect x="0" y="0" width="860" height="584" rx="12" fill="var(--bg)"/>

  <!-- Stage 1: Caller Identity and Session Lineage -->
  <g id="stage-caller">
    <rect x="16" y="16" width="828" height="132" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="40">1. Caller Identity &amp; Session Lineage<tspan class="band-sub" dx="10">Checked automatically on every transcript request</tspan></text>

    <!-- Top-Level Session -->
    <rect x="32" y="54" width="382" height="78" rx="6" fill="var(--card)" stroke="var(--allow-border)" stroke-width="1"/>
    <text class="node-title" x="223" y="78" style="fill:var(--green)">Top-Level User Session</text>
    <text class="node-sub" x="223" y="98">Direct user conversation</text>
    <text class="node-sub" x="223" y="116">Never locked out by another session's policy</text>

    <!-- Child Session -->
    <rect x="446" y="54" width="382" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="637" y="78">Child Subagent or Swarm Worker</text>
    <text class="node-sub" x="637" y="98">Spawned by a parent coordinator</text>
    <text class="node-sub" x="637" y="116">Bound to its parent's policy &amp; worker roster name</text>
  </g>

  <!-- Stage 1 to Stage 2 Connector -->
  <g id="connector-1-2">
    <line class="arrow-line" x1="430" y1="148" x2="430" y2="192"/>
    <polygon class="arrow-head" points="430,200 425.5,191 434.5,191"/>
    <rect x="298" y="162" width="264" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="430" y="177">evaluates request in strict priority order</text>
  </g>

  <!-- Stage 2: Five-Tier Access Precedence -->
  <g id="stage-precedence">
    <rect x="16" y="200" width="828" height="186" rx="10" fill="var(--band-tiers)" stroke="var(--band-tiers-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="224" style="fill:var(--accent)">2. Five-Tier Access Precedence<tspan class="band-sub" dx="10">First matching rule decides (highest priority left to right)</tspan></text>

    <!-- Card 1: Tiers 1-2 -->
    <rect x="32" y="240" width="244" height="130" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="tier-title" x="46" y="264">Tiers 1-2: Owner &amp; Deny</text>
    <text class="tier-item" x="46" y="290">1. Parent session owner</text>
    <text class="tier-note" x="58" y="307">Always retains full access</text>
    <text class="tier-item" x="46" y="331">2. Explicit CLI deny list</text>
    <text class="tier-note" x="58" y="348">Blocks matching worker or ID</text>

    <!-- Arrow 1 -> 2 -->
    <line class="arrow-line" x1="276" y1="305" x2="300" y2="305"/>
    <polygon class="arrow-head" points="308,305 299,300.5 299,309.5"/>

    <!-- Card 2: Tiers 3-4 -->
    <rect x="308" y="240" width="244" height="130" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="tier-title" x="322" y="264">Tiers 3-4: Allow &amp; Launch</text>
    <text class="tier-item" x="322" y="290">3. Explicit CLI allow list</text>
    <text class="tier-note" x="334" y="307">Grants auditors or named roles</text>
    <text class="tier-item" x="322" y="331">4. First-line launch rule</text>
    <text class="tier-note" x="334" y="348">Sets deny, self-only, or allow</text>

    <!-- Arrow 2 -> 3 -->
    <line class="arrow-line" x1="552" y1="305" x2="576" y2="305"/>
    <polygon class="arrow-head" points="584,305 575,300.5 575,309.5"/>

    <!-- Card 3: Tier 5 -->
    <rect x="584" y="240" width="244" height="130" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="tier-title" x="598" y="264">Tier 5: Cohort Default</text>
    <text class="tier-item" x="598" y="290">5. Parent default mode</text>
    <text class="tier-note" x="610" y="307">open, allowlist, self-only,</text>
    <text class="tier-note" x="610" y="324">or deny for child workers</text>
    <text class="tier-note" x="610" y="348">Auto-expires via policy TTL</text>
  </g>

  <!-- Stage 2 to Stage 3 Connectors -->
  <g id="connector-2-3">
    <line class="arrow-line" x1="223" y1="386" x2="223" y2="428" style="stroke:var(--green)"/>
    <polygon points="223,436 218.5,427 227.5,427" style="fill:var(--green)"/>
    <rect x="165" y="399" width="116" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="223" y="414" style="fill:var(--green)">access granted</text>

    <line class="arrow-line" x1="637" y1="386" x2="637" y2="428" style="stroke:var(--red)"/>
    <polygon points="637,436 632.5,427 641.5,427" style="fill:var(--red)"/>
    <rect x="577" y="399" width="120" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="637" y="414" style="fill:var(--red)">access blocked</text>
  </g>

  <!-- Stage 3: Enforcement and Defense in Depth -->
  <g id="stage-enforcement">
    <rect x="16" y="436" width="828" height="132" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="460">3. Enforcement &amp; Defense in Depth<tspan class="band-sub" dx="10">Verified by both the hook and the agy-context CLI</tspan></text>

    <!-- Allow Outcome -->
    <rect x="32" y="474" width="382" height="78" rx="6" fill="var(--allow-bg)" stroke="var(--allow-border)" stroke-width="1.25"/>
    <text class="node-title" x="223" y="498" style="fill:var(--green)">Allow with Short-Lived Token</text>
    <text class="node-sub" x="223" y="518">Hook issues a single-use read token verified by CLI</text>
    <text class="node-sub" x="223" y="536">Pins worker to its own transcript in self-only mode</text>

    <!-- Block Outcome -->
    <rect x="446" y="474" width="382" height="78" rx="6" fill="var(--deny-bg)" stroke="var(--deny-border)" stroke-width="1.25"/>
    <text class="node-title" x="637" y="498" style="fill:var(--red)">Block &amp; Prevent Bypass</text>
    <text class="node-sub" x="637" y="518">Rejects raw log reads and unauthorized CLI queries</text>
    <text class="node-sub" x="637" y="536">Pauses for user confirmation after repeated strikes</text>
  </g>
</svg>
