<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 716" width="920" height="716" style="max-width:100%;height:auto" role="img" aria-labelledby="acs-cmp-title acs-cmp-desc">
  <title id="acs-cmp-title">Default Antigravity Session vs. Antigravity with Agy-Context-Saver</title>
  <desc id="acs-cmp-desc">Side-by-side comparison showing how Agy-Context-Saver transparently compresses shell output via RTK, bounds large workspace file reads, stops background polling loops, and lets parent sessions scope child transcript access without replacing Antigravity's native tools.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --panel-native: #f6f8fa;
      --panel-native-border: #d0d7de;
      --panel-acs: #f2f7fd;
      --panel-acs-border: #80b3f2;
      --panel-add: #f6f8fa;
      --audit-bg: #eef8f0;
      --audit-border: #52a868;
      --card-border: #d0d7de;
      --accent: #0969da;
      --green: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --panel-native: #161b22;
        --panel-native-border: #30363d;
        --panel-acs: #121d2b;
        --panel-acs-border: #2f5d96;
        --panel-add: #161b22;
        --audit-bg: #122117;
        --audit-border: #2d7a43;
        --card-border: #30363d;
        --accent: #58a6ff;
        --green: #3fb950;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .panel-title { font-size: 15px; font-weight: 700; }
    .panel-sub { font-size: 12px; fill: var(--muted); }
    .section-title { font-size: 13px; font-weight: 700; fill: var(--accent); }
    .row-title { font-size: 13px; font-weight: 600; }
    .row-sub { font-size: 11.5px; fill: var(--muted); }
    .card-head { font-size: 13px; font-weight: 600; }
    .card-body { font-size: 11.5px; fill: var(--muted); }
    .foot-note { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
  </style>

  <!-- Self-contained adaptive canvas background (seamless on GitHub/Zensical light and dark) -->
  <rect x="0" y="0" width="920" height="716" rx="12" fill="var(--bg)"/>

  <!-- LEFT PANEL: Default Antigravity Session -->
  <g id="panel-default">
    <rect x="16" y="16" width="424" height="464" rx="10" fill="var(--panel-native)" stroke="var(--panel-native-border)" stroke-width="1.25"/>
    <text class="panel-title" x="36" y="44">Default Antigravity Session</text>
    <text class="panel-sub" x="36" y="63">Native tools running without context or transcript guards</text>

    <!-- Row 1 -->
    <rect x="36" y="82" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="row-title" x="52" y="108">Shell &amp; Test Commands</text>
    <text class="row-sub" x="52" y="128">Verbose build, git, and test output fills the</text>
    <text class="row-sub" x="52" y="144">context window and slows long sessions</text>

    <!-- Row 2 -->
    <rect x="36" y="168" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="row-title" x="52" y="194">Workspace File Reads</text>
    <text class="row-sub" x="52" y="214">Unbounded full-file dumps burn tokens on</text>
    <text class="row-sub" x="52" y="230">multi-thousand-line source files</text>

    <!-- Row 3 -->
    <rect x="36" y="254" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="row-title" x="52" y="280">Background Task Checks</text>
    <text class="row-sub" x="52" y="300">Tight status-polling loops and short timers</text>
    <text class="row-sub" x="52" y="316">waste agent turns while builds run</text>

    <!-- Row 4 -->
    <rect x="36" y="340" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="row-title" x="52" y="366">Session Logs &amp; Child Workers</text>
    <text class="row-sub" x="52" y="386">Child subagents and swarm workers can read</text>
    <text class="row-sub" x="52" y="402">raw session logs directly from disk</text>

    <!-- Baseline footnote -->
    <text class="foot-note" x="228" y="444">Native tools work as expected, but long runs fill</text>
    <text class="foot-note" x="228" y="462">context quickly and lack child transcript scoping</text>
  </g>

  <!-- Center Transition Indicator -->
  <g id="bridge-indicator">
    <line x1="446" y1="248" x2="466" y2="248" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="474,248 464,242.5 464,253.5" fill="var(--accent)"/>
  </g>

  <!-- RIGHT PANEL: Antigravity + Agy-Context-Saver -->
  <g id="panel-guarded">
    <rect x="480" y="16" width="424" height="464" rx="10" fill="var(--panel-acs)" stroke="var(--panel-acs-border)" stroke-width="1.25"/>
    <text class="panel-title" x="500" y="44" style="fill:var(--accent)">Antigravity + Agy-Context-Saver</text>
    <text class="panel-sub" x="500" y="63">Same native tools, transparently guarded before execution</text>

    <!-- Row 1 -->
    <rect x="500" y="82" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--panel-acs-border)" stroke-width="1"/>
    <text class="row-title" x="516" y="108">Shell &amp; Test Commands &#8594; RTK</text>
    <text class="row-sub" x="516" y="128">Compresses noisy shell &amp; test logs via RTK</text>
    <text class="row-sub" x="516" y="144">before output enters the context window</text>

    <!-- Row 2 -->
    <rect x="500" y="168" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--panel-acs-border)" stroke-width="1"/>
    <text class="row-title" x="516" y="194">Focused Workspace File Reads</text>
    <text class="row-sub" x="516" y="214">Caps large reads to focused line ranges while</text>
    <text class="row-sub" x="516" y="230">letting small files &amp; skill docs pass through</text>

    <!-- Row 3 -->
    <rect x="500" y="254" width="384" height="72" rx="6" fill="var(--card)" stroke="var(--panel-acs-border)" stroke-width="1"/>
    <text class="row-title" x="516" y="280">Event-Driven Task Wakeups</text>
    <text class="row-sub" x="516" y="300">Stops rapid polling loops with cooldowns so</text>
    <text class="row-sub" x="516" y="316">sessions sleep idle and resume on finish</text>

    <!-- Row 4 -->
    <rect x="500" y="340" width="384" height="72" rx="6" fill="var(--audit-bg)" stroke="var(--audit-border)" stroke-width="1.25"/>
    <text class="row-title" x="516" y="366" style="fill:var(--green)">Scoped Transcript Access</text>
    <text class="row-sub" x="516" y="386">Blocks raw disk reads of internal logs; parents</text>
    <text class="row-sub" x="516" y="402">scope child access via the agy-context CLI</text>

    <!-- Summary footnote -->
    <text class="foot-note" x="692" y="444">Runs as a lightweight pre-tool hook; never replaces</text>
    <text class="foot-note" x="692" y="462">Antigravity's built-in shell, file, or task tools</text>
  </g>

  <!-- BOTTOM SUMMARY STRIP -->
  <g id="panel-additions">
    <rect x="16" y="498" width="888" height="202" rx="10" fill="var(--panel-add)" stroke="var(--panel-native-border)" stroke-width="1.25"/>
    <text class="section-title" x="36" y="525">What Agy-Context-Saver transparently changes (without replacing Antigravity's tools)</text>

    <!-- Card 1 -->
    <rect x="36" y="540" width="416" height="66" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="card-head" x="52" y="564">1. Compresses Shell Output via RTK</text>
    <text class="card-body" x="52" y="586">Shrinks noisy git, test, and build logs automatically</text>

    <!-- Card 2 -->
    <rect x="468" y="540" width="416" height="66" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="card-head" x="484" y="564">2. Keeps Workspace File Reads Bounded</text>
    <text class="card-body" x="484" y="586">Guides large reads to line slices; small files &amp; skills pass</text>

    <!-- Card 3 -->
    <rect x="36" y="618" width="416" height="66" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="card-head" x="52" y="642">3. Stops Busy-Polling Loops</text>
    <text class="card-body" x="52" y="664">Applies cooldowns so agents rely on event-driven wakeups</text>

    <!-- Card 4 -->
    <rect x="468" y="618" width="416" height="66" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="card-head" x="484" y="642">4. Guards &amp; Scopes Transcript Access</text>
    <text class="card-body" x="484" y="664">Blocks raw internal logs; parents scope child access via CLI</text>
  </g>
</svg>
