<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 564" width="880" height="564" style="max-width:100%;height:auto" role="img" aria-labelledby="hook-flow-title hook-flow-desc">
  <title id="hook-flow-title">Agy-Context-Saver Pre-Tool Hook Interception Flow</title>
  <desc id="hook-flow-desc">Three-stage flow showing how incoming Antigravity tool calls pass through state protection, file-read bounds, polling cooldowns, and RTK shell routing before being blocked with guidance or allowed and rewritten.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --band-neutral: #f6f8fa;
      --band-neutral-border: #d0d7de;
      --band-guard: #f2f7fd;
      --band-guard-border: #80b3f2;
      --allow-bg: #eef8f0;
      --allow-border: #52a868;
      --deny-bg: #fdf2f2;
      --deny-border: #d9757c;
      --card-border: #d0d7de;
      --accent: #0969da;
      --green: #1a7f37;
      --red: #b4232c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --band-neutral: #161b22;
        --band-neutral-border: #30363d;
        --band-guard: #121d2b;
        --band-guard-border: #2f5d96;
        --allow-bg: #122117;
        --allow-border: #2d7a43;
        --deny-bg: #261417;
        --deny-border: #913d43;
        --card-border: #30363d;
        --accent: #58a6ff;
        --green: #3fb950;
        --red: #ff7b72;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .band-title { font-size: 13px; font-weight: 600; }
    .band-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .node-title { font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .node-sub { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
    .edge-label { font-size: 12px; font-weight: 500; fill: var(--muted); text-anchor: middle; }
    .arrow-line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
    .arrow-head { fill: var(--line); }
  </style>

  <!-- Self-contained adaptive canvas background (seamless on GitHub/Zensical light and dark) -->
  <rect x="0" y="0" width="880" height="564" rx="12" fill="var(--bg)"/>

  <!-- Stage 1: Incoming Tool Call -->
  <g id="stage-incoming">
    <rect x="16" y="16" width="848" height="104" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="40">1. Incoming Antigravity Tool Call<tspan class="band-sub" dx="10">Evaluated before the host executes the call</tspan></text>

    <rect x="108" y="54" width="664" height="50" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="440" y="75">Governed Tool Categories</text>
    <text class="node-sub" x="440" y="94">Shell commands  &#183;  Workspace file reads &amp; edits  &#183;  Background task checks &amp; timers</text>
  </g>

  <!-- Stage 1 to Stage 2 Connector -->
  <g id="connector-1-2">
    <line class="arrow-line" x1="440" y1="120" x2="440" y2="152"/>
    <polygon class="arrow-head" points="440,160 435.5,151 444.5,151"/>
  </g>

  <!-- Stage 2: Pre-Tool Guard Checks -->
  <g id="stage-checks">
    <rect x="16" y="160" width="848" height="192" rx="10" fill="var(--band-guard)" stroke="var(--band-guard-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="184" style="fill:var(--accent)">2. Pre-Tool Guard Checks<tspan class="band-sub" dx="10">Fast local policy checks before execution</tspan></text>

    <!-- Check 1 -->
    <rect x="32" y="200" width="192" height="134" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="128" y="228">State &amp; Log Guard</text>
    <text class="node-sub" x="128" y="254">Blocks writes to</text>
    <text class="node-sub" x="128" y="272">internal logs,</text>
    <text class="node-sub" x="128" y="290">running task logs, and</text>
    <text class="node-sub" x="128" y="308">hook state files</text>

    <!-- Check 2 -->
    <rect x="240" y="200" width="192" height="134" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="336" y="228">File Read Bounds</text>
    <text class="node-sub" x="336" y="254">Requires focused line</text>
    <text class="node-sub" x="336" y="272">slices on large files;</text>
    <text class="node-sub" x="336" y="290">small files &amp; skill docs</text>
    <text class="node-sub" x="336" y="308">pass directly</text>

    <!-- Check 3 -->
    <rect x="448" y="200" width="192" height="134" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="544" y="228">Polling Cooldowns</text>
    <text class="node-sub" x="544" y="254">Allows initial status</text>
    <text class="node-sub" x="544" y="272">check; blocks rapid</text>
    <text class="node-sub" x="544" y="290">repeat polls &amp; short</text>
    <text class="node-sub" x="544" y="308">watchdog timers</text>

    <!-- Check 4 -->
    <rect x="656" y="200" width="192" height="134" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="752" y="228">RTK Shell Routing</text>
    <text class="node-sub" x="752" y="254">Compresses noisy shell</text>
    <text class="node-sub" x="752" y="272">commands via RTK;</text>
    <text class="node-sub" x="752" y="290">lets short commands</text>
    <text class="node-sub" x="752" y="308">finish synchronously</text>
  </g>

  <!-- Stage 2 to Stage 3 Connectors -->
  <g id="connector-2-3">
    <line class="arrow-line" x1="236" y1="352" x2="236" y2="404" style="stroke:var(--red)"/>
    <polygon points="236,412 231.5,403 240.5,403" style="fill:var(--red)"/>
    <rect x="134" y="370" width="204" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="236" y="385" style="fill:var(--red)">policy violation or rapid poll</text>

    <line class="arrow-line" x1="644" y1="352" x2="644" y2="404" style="stroke:var(--green)"/>
    <polygon points="644,412 639.5,403 648.5,403" style="fill:var(--green)"/>
    <rect x="546" y="370" width="196" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="644" y="385" style="fill:var(--green)">safe call or RTK rewrite</text>
  </g>

  <!-- Stage 3: Hook Decision -->
  <g id="stage-decision">
    <rect x="16" y="412" width="848" height="136" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25"/>
    <text class="band-title" x="32" y="436">3. Hook Decision<tspan class="band-sub" dx="10">Fails closed on unexpected errors</tspan></text>

    <!-- Block Outcome -->
    <rect x="32" y="452" width="396" height="80" rx="6" fill="var(--deny-bg)" stroke="var(--deny-border)" stroke-width="1.25"/>
    <text class="node-title" x="230" y="476" style="fill:var(--red)">Block with Actionable Guidance</text>
    <text class="node-sub" x="230" y="497">Suggests the safer search, slice, or wakeup step</text>
    <text class="node-sub" x="230" y="515">Pauses for user confirmation after repeated blocks</text>

    <!-- Allow Outcome -->
    <rect x="452" y="452" width="396" height="80" rx="6" fill="var(--allow-bg)" stroke="var(--allow-border)" stroke-width="1.25"/>
    <text class="node-title" x="650" y="476" style="fill:var(--green)">Allow (Direct or Rewritten)</text>
    <text class="node-sub" x="650" y="497">Passes safe file slices, skill docs, and valid checks</text>
    <text class="node-sub" x="650" y="515">Applies RTK compression to noisy output</text>
  </g>
</svg>
