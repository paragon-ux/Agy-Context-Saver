<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 548" width="820" height="548" style="max-width:100%;height:auto" role="img" aria-labelledby="acs-arch-title acs-arch-desc">
  <title id="acs-arch-title">Agy-Context-Saver and RTK Execution Architecture</title>
  <desc id="acs-arch-desc">Three-layer overview showing Google Antigravity agent tool calls intercepted by Agy-Context-Saver before execution and routed through RTK shell output compression, the agy-context transcript CLI, and event-driven wakeups.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --band-runtime: #f6f8fa;
      --band-runtime-border: #d0d7de;
      --band-acs: #f2f7fd;
      --band-acs-border: #80b3f2;
      --band-engine: #f7f4fc;
      --band-engine-border: #c2a8f0;
      --card-border: #d0d7de;
      --accent: #0969da;
      --purple: #6639ba;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --band-runtime: #161b22;
        --band-runtime-border: #30363d;
        --band-acs: #121d2b;
        --band-acs-border: #2f5d96;
        --band-engine: #1b1726;
        --band-engine-border: #55407d;
        --card-border: #30363d;
        --accent: #58a6ff;
        --purple: #bc8cff;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .band-title { font-size: 13px; font-weight: 600; }
    .band-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .node-title { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub { font-size: 12px; font-weight: 400; fill: var(--muted); text-anchor: middle; }
    .edge-label { font-size: 12px; font-weight: 500; fill: var(--muted); text-anchor: middle; }
    .arrow-line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
    .arrow-head { fill: var(--line); }
  </style>

  <!-- Self-contained adaptive canvas background (seamless on GitHub/Zensical light and dark) -->
  <rect x="0" y="0" width="820" height="548" rx="12" fill="var(--bg)"/>

  <!-- Layer 1: Google Antigravity Agent Tool Calls -->
  <g id="layer-runtime">
    <rect x="12" y="12" width="796" height="136" rx="10" fill="var(--band-runtime)" stroke="var(--band-runtime-border)" stroke-width="1.25"/>
    <text class="band-title" x="28" y="36">Google Antigravity<tspan class="band-sub" dx="10">Native Agent Tool Calls</tspan></text>

    <!-- Node A1 -->
    <rect x="28" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="84">Shell &amp; CLI Commands</text>
    <text class="node-sub" x="144" y="105">Git, tests, builds &amp; search</text>

    <!-- Node A2 -->
    <rect x="294" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="84">File Reads &amp; Edits</text>
    <text class="node-sub" x="410" y="105">Workspace code &amp; skill docs</text>

    <!-- Node A3 -->
    <rect x="560" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="84">Background Tasks &amp; Timers</text>
    <text class="node-sub" x="676" y="105">Async checks &amp; schedules</text>
  </g>

  <!-- Layer 1 to Layer 2 Connectors -->
  <g id="connectors-1-2">
    <line class="arrow-line" x1="240" y1="148" x2="240" y2="198"/>
    <polygon class="arrow-head" points="240,206 235.5,197 244.5,197"/>
    <rect x="140" y="165" width="200" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="240" y="180">inspects calls before execution</text>

    <line class="arrow-line" x1="580" y1="206" x2="580" y2="156"/>
    <polygon class="arrow-head" points="580,148 575.5,157 584.5,157"/>
    <rect x="478" y="165" width="204" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="580" y="180">compact output &amp; safe guidance</text>
  </g>

  <!-- Layer 2: Agy-Context-Saver Guard Hook -->
  <g id="layer-guard">
    <rect x="12" y="206" width="796" height="136" rx="10" fill="var(--band-acs)" stroke="var(--band-acs-border)" stroke-width="1.25"/>
    <text class="band-title" x="28" y="230" style="fill:var(--accent)">Agy-Context-Saver<tspan class="band-sub" dx="10">Pre-Tool Execution Guard Hook</tspan></text>

    <!-- Node B1 -->
    <rect x="28" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="278">Command &amp; Log Guard</text>
    <text class="node-sub" x="144" y="299">Routes shell; blocks raw logs</text>

    <!-- Node B2 -->
    <rect x="294" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="278">Focused File Reads</text>
    <text class="node-sub" x="410" y="299">Caps huge files; allows skills</text>

    <!-- Node B3 -->
    <rect x="560" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="278">Poll Loop Protection</text>
    <text class="node-sub" x="676" y="299">Stops busy checks; favors wait</text>
  </g>

  <!-- Layer 2 to Layer 3 Connectors -->
  <g id="connectors-2-3">
    <line class="arrow-line" x1="240" y1="342" x2="240" y2="392"/>
    <polygon class="arrow-head" points="240,400 235.5,391 244.5,391"/>
    <rect x="144" y="359" width="192" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="240" y="374">rewrites commands &amp; scopes CLI</text>

    <line class="arrow-line" x1="580" y1="400" x2="580" y2="350"/>
    <polygon class="arrow-head" points="580,342 575.5,351 584.5,351"/>
    <rect x="478" y="359" width="204" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="580" y="374">trimmed logs &amp; wakeup signals</text>
  </g>

  <!-- Layer 3: Compression, Transcript CLI and Host Wakeups -->
  <g id="layer-engines">
    <rect x="12" y="400" width="796" height="136" rx="10" fill="var(--band-engine)" stroke="var(--band-engine-border)" stroke-width="1.25"/>
    <text class="band-title" x="28" y="424" style="fill:var(--purple)">Companion Tools &amp; Runtime<tspan class="band-sub" dx="10">Output Compression, Transcript CLI &amp; Wakeups</tspan></text>

    <!-- Node C1 -->
    <rect x="28" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="472">RTK Output Compressor</text>
    <text class="node-sub" x="144" y="493">Shrinks noisy shell &amp; test logs</text>

    <!-- Node C2 -->
    <rect x="294" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="472">agy-context CLI</text>
    <text class="node-sub" x="410" y="493">Safe transcript search &amp; access</text>

    <!-- Node C3 -->
    <rect x="560" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="472">Event-Driven Wakeups</text>
    <text class="node-sub" x="676" y="493">Sleep idle, resume on finish</text>
  </g>
</svg>
