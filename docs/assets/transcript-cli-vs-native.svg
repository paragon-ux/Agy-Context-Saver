<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" style="max-width:100%;height:auto" role="img" aria-labelledby="tx-split-title tx-split-desc">
  <title id="tx-split-title">Native Antigravity Logs vs. agy-context Transcript CLI</title>
  <desc id="tx-split-desc">Shared-source branching diagram showing that native manual file inspection and the agy-context transcript CLI read the same Antigravity session logs on disk, contrasting raw-log friction on the left against five purple- and green-accented CLI capabilities on the right.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --card-border: #d0d7de;
      --band-neutral: #f6f8fa;
      --band-neutral-border: #d0d7de;
      --band-purple: #f7f4fc;
      --band-purple-border: #c2a8f0;
      --purple: #6639ba;
      --purple-badge-bg: #efe8fc;
      --audit-bg: #eef8f0;
      --audit-border: #52a868;
      --green: #1a7f37;
      --green-badge-bg: #dcf4e2;
      --warn-bg: #fdf2f2;
      --warn-border: #d9757c;
      --warn: #b4232c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --card-border: #30363d;
        --band-neutral: #161b22;
        --band-neutral-border: #30363d;
        --band-purple: #1b1726;
        --band-purple-border: #55407d;
        --purple: #bc8cff;
        --purple-badge-bg: #2a2140;
        --audit-bg: #122117;
        --audit-border: #2d7a43;
        --green: #3fb950;
        --green-badge-bg: #183622;
        --warn-bg: #261417;
        --warn-border: #913d43;
        --warn: #ff7b72;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .band-title { font-size: 13.5px; font-weight: 700; }
    .band-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .panel-title { font-size: 14.5px; font-weight: 700; }
    .panel-sub { font-size: 11.5px; fill: var(--muted); }
    .source-title { font-size: 13px; font-weight: 600; }
    .source-sub { font-size: 11.5px; fill: var(--muted); }
    .edge-label { font-size: 11.5px; font-weight: 500; text-anchor: middle; }
    .item-title { font-size: 12.5px; font-weight: 600; }
    .item-sub { font-size: 11px; fill: var(--muted); }
    .tile-title { font-size: 12.5px; font-weight: 600; }
    .tile-sub { font-size: 11px; fill: var(--muted); }
    .badge-text { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-anchor: middle; }
    .foot-note { font-size: 11px; fill: var(--muted); text-anchor: middle; }
    .divider { stroke: var(--card-border); stroke-width: 1; opacity: 0.65; }
  </style>

  <!-- Self-contained adaptive canvas background (matches GitHub and Zensical light and dark themes) -->
  <rect x="0" y="0" width="920" height="560" rx="12" fill="var(--bg)"/>

  <!-- TOP BAND: Shared Source on Disk -->
  <g id="shared-source">
    <rect x="16" y="16" width="888" height="112" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25"/>
    <text class="band-title" x="34" y="40">Shared Source: Native Antigravity Session Logs on Disk<tspan class="band-sub" dx="10">Read in place without changing Antigravity's log format</tspan></text>

    <!-- Source Card 1 -->
    <rect x="34" y="54" width="418" height="58" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="source-title" x="50" y="77">Desktop, IDE &amp; CLI Session Folders</text>
    <text class="source-sub" x="50" y="97">Separate session directories stored for each Antigravity surface</text>

    <!-- Source Card 2 -->
    <rect x="468" y="54" width="420" height="58" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="source-title" x="484" y="77">Compact &amp; Full Log File Pairs</text>
    <text class="source-sub" x="484" y="97">Routine steps in one file; cut-off outputs saved in a second full file</text>
  </g>

  <!-- BRANCHING CONNECTORS -->
  <g id="connectors">
    <!-- Left dashed branch: manual inspection -->
    <line x1="166" y1="128" x2="166" y2="170" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polygon points="166,178 161.5,169 170.5,169" fill="var(--line)"/>
    <rect x="92" y="141" width="148" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="166" y="156" style="fill:var(--muted)">manual file inspection</text>

    <!-- Right solid purple branch: via CLI -->
    <line x1="619" y1="128" x2="619" y2="170" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="619,178 614,168.5 624,168.5" fill="var(--purple)"/>
    <rect x="524" y="141" width="190" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="619" y="156" style="fill:var(--purple);font-weight:600">via agy-context transcript CLI</text>
  </g>

  <!-- LEFT BRANCH: Inspecting Raw Logs Directly (Compact Muted Friction List) -->
  <g id="panel-raw">
    <rect x="16" y="178" width="300" height="366" rx="10" fill="var(--band-neutral)" stroke="var(--band-neutral-border)" stroke-width="1.25" stroke-dasharray="5 3"/>
    <text class="panel-title" x="34" y="206">Inspecting Raw Logs Directly</text>
    <text class="panel-sub" x="34" y="225">Manual path lookups and raw disk reads</text>

    <!-- Single compact card with 5 friction rows -->
    <rect x="34" y="242" width="264" height="256" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>

    <!-- Friction 1 -->
    <circle cx="51" cy="261.5" r="7.5" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
    <text x="51" y="265.3" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--warn)">&#215;</text>
    <text class="item-title" x="66" y="266">Manual session lookup</text>
    <text class="item-sub" x="66" y="282">Need each ID; grep for child runs</text>
    <line class="divider" x1="46" y1="294" x2="286" y2="294"/>

    <!-- Friction 2 -->
    <circle cx="51" cy="310.5" r="7.5" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
    <text x="51" y="314.3" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--warn)">&#215;</text>
    <text class="item-title" x="66" y="315">Oversized raw dumps</text>
    <text class="item-sub" x="66" y="331">Multi-MB logs hit output limits</text>
    <line class="divider" x1="46" y1="343" x2="286" y2="343"/>

    <!-- Friction 3 -->
    <circle cx="51" cy="359.5" r="7.5" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
    <text x="51" y="363.3" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--warn)">&#215;</text>
    <text class="item-title" x="66" y="364">Two-file step matching</text>
    <text class="item-sub" x="66" y="380">Open full log by hand for cut-offs</text>
    <line class="divider" x1="46" y1="392" x2="286" y2="392"/>

    <!-- Friction 4 -->
    <circle cx="51" cy="408.5" r="7.5" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
    <text x="51" y="412.3" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--warn)">&#215;</text>
    <text class="item-title" x="66" y="413">No session health view</text>
    <text class="item-sub" x="66" y="429">No turn, size, or polling checks</text>
    <line class="divider" x1="46" y1="441" x2="286" y2="441"/>

    <!-- Friction 5 -->
    <circle cx="51" cy="457.5" r="7.5" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
    <text x="51" y="461.3" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--warn)">&#215;</text>
    <text class="item-title" x="66" y="462">No child boundaries</text>
    <text class="item-sub" x="66" y="478">Raw disk reads; no secret redaction</text>

    <!-- Left footnote -->
    <text class="foot-note" x="166" y="524">Works on disk, but slows down long runs</text>
  </g>

  <!-- RIGHT BRANCH: agy-context Transcript CLI (Purple Band + Command Tiles + Green Governance Tile) -->
  <g id="panel-cli">
    <rect x="334" y="178" width="570" height="366" rx="10" fill="var(--band-purple)" stroke="var(--band-purple-border)" stroke-width="1.25"/>
    <text class="panel-title" x="354" y="206" style="fill:var(--purple)">agy-context Transcript CLI</text>
    <text class="panel-sub" x="354" y="225">Structured discovery, bounded output, health checks, and access control</text>

    <!-- Tile 1: list -->
    <rect x="354" y="242" width="258" height="86" rx="6" fill="var(--card)" stroke="var(--band-purple-border)" stroke-width="1"/>
    <rect x="368" y="254" width="40" height="20" rx="4" fill="var(--purple-badge-bg)"/>
    <text class="badge-text" x="388" y="268" style="fill:var(--purple)">list</text>
    <text class="tile-title" x="416" y="268">Session &amp; Team Discovery</text>
    <text class="tile-sub" x="368" y="294">Finds sessions across IDE, app, &amp; CLI</text>
    <text class="tile-sub" x="368" y="310">and groups parents with child workers</text>

    <!-- Tile 2: read / outline -->
    <rect x="626" y="242" width="258" height="86" rx="6" fill="var(--card)" stroke="var(--band-purple-border)" stroke-width="1"/>
    <rect x="640" y="254" width="106" height="20" rx="4" fill="var(--purple-badge-bg)"/>
    <text class="badge-text" x="693" y="268" style="fill:var(--purple)">read / outline</text>
    <text class="tile-title" x="754" y="268">Bounded Output</text>
    <text class="tile-sub" x="640" y="294">Clean Markdown summaries under 9.2 KB</text>
    <text class="tile-sub" x="640" y="310">with filter pipes &amp; deep file exports</text>

    <!-- Tile 3: query / step -->
    <rect x="354" y="340" width="258" height="86" rx="6" fill="var(--card)" stroke="var(--band-purple-border)" stroke-width="1"/>
    <rect x="368" y="352" width="94" height="20" rx="4" fill="var(--purple-badge-bg)"/>
    <text class="badge-text" x="415" y="366" style="fill:var(--purple)">query / step</text>
    <text class="tile-title" x="470" y="366">Full-Step Search</text>
    <text class="tile-sub" x="368" y="392">Searches logs and pulls cut-off steps</text>
    <text class="tile-sub" x="368" y="408">or single fields across lists &amp; ranges</text>

    <!-- Tile 4: health -->
    <rect x="626" y="340" width="258" height="86" rx="6" fill="var(--card)" stroke="var(--band-purple-border)" stroke-width="1"/>
    <rect x="640" y="352" width="54" height="20" rx="4" fill="var(--purple-badge-bg)"/>
    <text class="badge-text" x="667" y="366" style="fill:var(--purple)">health</text>
    <text class="tile-title" x="702" y="366">Session &amp; Team Health</text>
    <text class="tile-sub" x="640" y="392">Reports turns, tool calls, log size, &amp;</text>
    <text class="tile-sub" x="640" y="408">polling warnings for one run or a team</text>

    <!-- Tile 5: access / export (Full-width green governance tile) -->
    <rect x="354" y="438" width="530" height="60" rx="6" fill="var(--audit-bg)" stroke="var(--audit-border)" stroke-width="1.25"/>
    <rect x="368" y="450" width="114" height="20" rx="4" fill="var(--green-badge-bg)"/>
    <text class="badge-text" x="425" y="464" style="fill:var(--green)">access / export</text>
    <text class="tile-title" x="492" y="464" style="fill:var(--green)">Scoped Child Access &amp; Redacted Exports</text>
    <text class="tile-sub" x="368" y="486">Parents scope child log access and export redacted summaries with secrets stripped</text>

    <!-- Right footnote -->
    <text class="foot-note" x="619" y="524">Runs as a local CLI; adds zero MCP tool schema overhead to idle sessions</text>
  </g>
</svg>
